<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanukah Jeopardy!</title>
    <style>
        :root {
            --bg-color: #121417;          /* Soft dark charcoal background */
            --card-bg: #1e222a;           /* Muted slate blue for board and cards */
            --card-border: #363c4a;       /* Subtle border */
            --text-main: #e2e8f0;         /* Soft off-white for text */
            --accent-gold: #f6d860;       /* Softer, warm gold */
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            text-align: center;
            font-size: 2.3rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-style: italic;
        }

        /* Teams Scoreboard */
        .teams-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 18px;
            text-align: center;
            min-width: 140px;
        }

        .team-name {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--accent-gold);
            cursor: pointer;
        }

        .team-score {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .score-buttons button {
            background: #2a303c;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 0 2px;
        }

        .score-buttons button:hover {
            background: #363c4a;
        }

        /* Game Board */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        .category-header {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .clue-cell {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.15s, transform 0.1s;
        }

        .clue-cell:hover:not(.used) {
            background-color: #262c38;
            transform: scale(1.02);
        }

        .clue-cell.used {
            background-color: #0b0c0e;
            color: #374151;
            border-color: #1a1d24;
            cursor: default;
        }

        /* Final Jeopardy Button Bar */
        .final-jeopardy-bar {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
            text-align: center;
        }

        .final-btn {
            background: #1e222a;
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .final-btn:hover {
            background: #262c38;
        }

        .final-btn.used {
            background: #0b0c0e;
            color: #374151;
            border-color: #1a1d24;
            cursor: default;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: #2a303c;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #363c4a;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #181c24;
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-top: 0;
        }

        .modal-body {
            font-size: 1.3rem;
            margin: 20px 0;
            line-height: 1.4;
            color: var(--text-main);
        }

        /* Award buttons grid inside modal */
        .award-section {
            margin-top: 20px;
            border-top: 1px dashed var(--card-border);
            padding-top: 15px;
        }

        .award-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .award-btn {
            background-color: #22c55e;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .award-btn:hover {
            background-color: #16a34a;
        }

        .award-btn.nobody {
            background-color: #374151;
            color: #e5e7eb;
            grid-column: span 2;
        }

        .award-btn.nobody:hover {
            background-color: #4b5563;
        }

        /* Editor Modal */
        .editor-modal .modal-content {
            max-width: 800px;
            text-align: left;
        }

        .editor-group {
            background: #121417;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .editor-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .editor-group input, .editor-group textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
            box-sizing: border-box;
            background: #1e222a;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <h1>🕯️ CHANUKAH JEOPARDY! 🕯️</h1>
    <div class="subtitle">The Festival of Lights trivia challenge</div>

    <!-- Scoreboard -->
    <div class="teams-container" id="scoreboard"></div>

    <!-- Game Board -->
    <div class="board" id="game-board"></div>

    <!-- Final Jeopardy Button -->
    <div class="final-jeopardy-bar">
        <button class="final-btn" id="final-jeopardy-trigger" onclick="openFinalJeopardy()">⭐ FINAL JEOPARDY ⭐</button>
    </div>

    <!-- Action Buttons -->
    <div class="controls">
        <button class="btn" onclick="openEditor()">Edit Questions & Answers</button>
        <button class="btn" onclick="resetGame()" style="background-color: #451a03; color: #fecaca; border-color: #7f1d1d;">Reset Game</button>
    </div>

    <!-- Question Modal -->
    <div class="modal" id="question-modal">
        <div class="modal-content">
            <h2 id="modal-category-title">Category</h2>
            <div class="modal-body" id="modal-question-text">Question goes here...</div>
            <div id="answer-container" style="display: none;">
                <hr style="border-color: var(--card-border); margin: 20px 0;">
                <div style="font-size: 1rem; color: var(--accent-gold); margin-bottom: 5px;">ANSWER:</div>
                <div class="modal-body" id="modal-answer-text" style="font-size: 1.2rem;">Answer goes here...</div>
                
                <div class="award-section">
                    <div style="font-size: 0.95rem; color: #94a3b8; margin-bottom: 8px;" id="award-instructions">AWARD POINTS TO:</div>
                    <div class="award-grid" id="award-buttons-container"></div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn" id="reveal-btn" onclick="revealAnswer()">Show Answer</button>
                <button class="btn" id="close-modal-btn" onclick="closeModal()" style="display: none; background-color: #374151;">Cancel / Close</button>
            </div>
        </div>
    </div>

    <!-- Editor Modal -->
    <div class="modal editor-modal" id="editor-modal">
        <div class="modal-content">
            <h2>Edit Game Content</h2>
            <div id="editor-fields"></div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn" onclick="saveEditor()" style="background-color: #166534; color: #fff;">Save & Apply</button>
                <button class="btn" onclick="closeEditor()" style="background-color: #451a03; color: #fecaca;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let gameData = {
            teams: [
                { name: "Moishe and Rena", score: 0 },
                { name: "Zalmy and Eli", score: 0 },
                { name: "Atara, Sarah, Raphaella", score: 0 },
                { name: "Rafi and Gavriel", score: 0 }
            ],
            categories: [
                {
                    name: "📜 CHANUKAH HISTORY",
                    questions: [
                        { q: "What ancient empire ruled over the Jewish people during the events leading to Chanukah?", a: "The Greek Empire" },
                        { q: "Who led the rebellion?", a: "Yehudah Maccabee" },
                        { q: "What was the name of the Jewish group that led the revolt?", a: "The Maccabees" },
                        { q: "What is another name for the Maccabees?", a: "The Chashmonaim" },
                        { q: "What does the word Chanukah mean?", a: "Dedication (The dedication of the second Beis Hamikdash)" }
                    ]
                },
                {
                    name: "🕎 CHANUKA NIGHT",
                    questions: [
                        { q: "What do we light every night?", a: "The Menorah" },
                        { q: "What is the candle we use to light the other candles called?", a: "The Shamesh" },
                        { q: "What are the three brachos we say on the first night?", a: "Lehadlik Ner, She'asah Nissim, and Shehecheyanu" },
                        { q: "What are the two songs we say after lighting?", a: "Haneiros Hallalu and Ma'oz Tzur" },
                        { q: "According to Beis Shammai how do we light the Menorah?", a: "Eight candles the first night and one candle the last night" }
                    ]
                },
                {
                    name: "🥔 CHANUKAH FOODS",
                    questions: [
                        { q: "What potato pancakes are traditionally eaten during Chanukah?", a: "Latkes" },
                        { q: "What jelly-filled treats are popular during Chanukah (Hebrew name)?", a: "Sufganiyot" },
                        { q: "What ingredient is especially important in traditional Chanukah foods because of the miracle?", a: "Oil" },
                        { q: "What sweet topping is commonly served on latkes?", a: "Applesauce" },
                        { q: "Why do we eat dairy on Chanukah?", a: "Because Yehuddis defeated the general by feeding him cheese and wine" }
                    ]
                },
                {
                    name: "🎲 DREIDEL & GAMES",
                    questions: [
                        { q: "How many sides does a dreidel have?", a: "Four" },
                        { q: "What are the four Hebrew letters on a dreidel?", a: "Nun, Gimel, Hey, and Shin (or Peh in Israel)" },
                        { q: "What does the letter Gimel mean in the dreidel game?", a: "Take the entire pot" },
                        { q: "What do the letters on the dreidel stand for?", a: "Nes Gadol Haya Sham" },
                        { q: "What does the dreidel phrase 'Nes Gadol Haya Sham' mean?", a: "A great miracle happened there." }
                    ]
                },
                {
                    name: "⭐ CHANUKAH CHALLENGE",
                    questions: [
                        { q: "What is the date when Chanukah begins?", a: "The 25th of Kislev" },
                        { q: "What is the Hebrew word for oil?", a: "Shemen" },
                        { q: "What is the Hebrew word for light?", a: "Ohr" },
                        { q: "How many candles are needed to light all eight nights, not counting the shamash?", a: "36 candles" },
                        { q: "Because Chanukah falls on late November or late December what hybrid holiday happened in 2013?", a: "Thanksgivukah" }
                    ]
                }
            ],
            finalJeopardy: {
                q: "What was the name of the Jewish family that led the revolt against the Seleucid Greeks?",
                a: "The Maccabees."
            },
            usedClues: {},
            finalUsed: false
        };

        let currentClueValue = 0;
        let isFinalJeopardy = false;
        let finalWagers = {};

        if (localStorage.getItem('chanukah_jeopardy_live_data')) {
            try {
                gameData = JSON.parse(localStorage.getItem('chanukah_jeopardy_live_data'));
            } catch (e) { console.error(e); }
        }

        function saveState() {
            localStorage.setItem('chanukah_jeopardy_live_data', JSON.stringify(gameData));
        }

        function renderBoard() {
            renderScoreboard();
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            gameData.categories.forEach((cat) => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerText = cat.name;
                board.appendChild(header);
            });

            for (let r = 0; r < 5; r++) {
                const value = (r + 1) * 100;
                gameData.categories.forEach((cat, cIdx) => {
                    const cell = document.createElement('div');
                    const clueKey = `${cIdx}-${r}`;
                    cell.className = 'clue-cell';
                    
                    if (gameData.usedClues[clueKey]) {
                        cell.classList.add('used');
                        cell.innerText = '';
                    } else {
                        cell.innerText = `$${value}`;
                        cell.onclick = () => openClue(cIdx, r, value);
                    }
                    board.appendChild(cell);
                });
            }

            const finalBtn = document.getElementById('final-jeopardy-trigger');
            if (gameData.finalUsed) {
                finalBtn.classList.add('used');
                finalBtn.innerText = '⭐ FINAL JEOPARDY (Played) ⭐';
            } else {
                finalBtn.classList.remove('used');
                finalBtn.innerText = '⭐ FINAL JEOPARDY ⭐';
            }
        }

        function renderScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '';
            gameData.teams.forEach((team, idx) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <div class="team-name" onclick="editTeamName(${idx})">${team.name} ✏️</div>
                    <div class="team-score">$${team.score}</div>
                    <div class="score-buttons">
                        <button onclick="adjustScore(${idx}, -100)">-</button>
                        <button onclick="adjustScore(${idx}, 100)">+</button>
                    </div>
                `;
                sb.appendChild(card);
            });
        }

        function adjustScore(teamIdx, amount) {
            gameData.teams[teamIdx].score += amount;
            saveState();
            renderScoreboard();
        }

        function editTeamName(teamIdx) {
            const newName = prompt("Enter new team name:", gameData.teams[teamIdx].name);
            if (newName !== null && newName.trim() !== "") {
                gameData.teams[teamIdx].name = newName.trim();
                saveState();
                renderScoreboard();
            }
        }

        function openClue(cIdx, rIdx, value) {
            const clueKey = `${cIdx}-${rIdx}`;
            gameData.usedClues[clueKey] = true;
            saveState();
            renderBoard();

            currentClueValue = value;
            isFinalJeopardy = false;
            const cat = gameData.categories[cIdx];
            const clue = cat.questions[rIdx];

            document.getElementById('modal-category-title').innerText = `${cat.name} - $${value}`;
            document.getElementById('modal-question-text').innerText = clue.q;
            document.getElementById('modal-answer-text').innerText = clue.a;
            
            resetModalView();
            document.getElementById('question-modal').style.display = 'flex';
        }

        function openFinalJeopardy() {
            // Prompt each team for their wagers before showing the question
            finalWagers = {};
            gameData.teams.forEach((team, idx) => {
                let maxWager = team.score > 0 ? team.score : 0;
                let promptMsg = `${team.name}, you have $${team.score}.\nEnter your Final Jeopardy wager (0 to $${maxWager}):`;
                let wagerInput = prompt(promptMsg, "0");
                
                let wager = parseInt(wagerInput);
                if (isNaN(wager) || wager < 0) wager = 0;
                if (wager > maxWager) wager = maxWager; // Cap at current score if they have points
                
                finalWagers[idx] = wager;
            });

            gameData.finalUsed = true;
            saveState();
            renderBoard();

            isFinalJeopardy = true;
            document.getElementById('modal-category-title').innerText = "⭐ FINAL JEOPARDY ⭐";
            document.getElementById('modal-question-text').innerText = gameData.finalJeopardy.q;
            document.getElementById('modal-answer-text').innerText = gameData.finalJeopardy.a;
            
            resetModalView();
            document.getElementById('question-modal').style.display = 'flex';
        }

        function resetModalView() {
            document.getElementById('answer-container').style.display = 'none';
            document.getElementById('reveal-btn').style.display = 'inline-block';
            document.getElementById('close-modal-btn').style.display = 'none';
        }

        function revealAnswer() {
            document.getElementById('answer-container').style.display = 'block';
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('close-modal-btn').style.display = 'inline-block';

            const container = document.getElementById('award-buttons-container');
            const instructions = document.getElementById('award-instructions');
            container.innerHTML = '';

            if (isFinalJeopardy) {
                instructions.innerText = "GRADE FINAL JEOPARDY WAGERS:";
                gameData.teams.forEach((team, idx) => {
                    let wager = finalWagers[idx] || 0;
                    
                    const correctBtn = document.createElement('button');
                    correctBtn.className = 'award-btn';
                    correctBtn.style.backgroundColor = '#22c55e';
                    correctBtn.innerText = `✔️ ${team.name} Correct (+$${wager})`;
                    correctBtn.onclick = () => resolveFinalWager(idx, true);

                    const wrongBtn = document.createElement('button');
                    wrongBtn.className = 'award-btn';
                    wrongBtn.style.backgroundColor = '#ef4444';
                    wrongBtn.innerText = `❌ ${team.name} Wrong (-$${wager})`;
                    wrongBtn.onclick = () => resolveFinalWager(idx, false);

                    container.appendChild(correctBtn);
                    container.appendChild(wrongBtn);
                });

                const closeFjBtn = document.createElement('button');
                closeFjBtn.className = 'award-btn nobody';
                closeFjBtn.innerText = 'Done Grading / Close';
                closeFjBtn.onclick = () => closeModal();
                container.appendChild(closeFjBtn);

            } else {
                instructions.innerText = "AWARD POINTS TO:";
                gameData.teams.forEach((team, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'award-btn';
                    btn.innerText = `+ $${currentClueValue} to ${team.name}`;
                    btn.onclick = () => awardPointsAndClose(idx);
                    container.appendChild(btn);
                });

                const nobodyBtn = document.createElement('button');
                nobodyBtn.className = 'award-btn nobody';
                nobodyBtn.innerText = 'Nobody Got It Right (0 Points)';
                nobodyBtn.onclick = () => closeModal();
                container.appendChild(nobodyBtn);
            }
        }

        function awardPointsAndClose(teamIdx) {
            gameData.teams[teamIdx].score += currentClueValue;
            saveState();
            renderScoreboard();
            closeModal();
        }

        function resolveFinalWager(teamIdx, isCorrect) {
            let wager = finalWagers[teamIdx] || 0;
            if (isCorrect) {
                gameData.teams[teamIdx].score += wager;
            } else {
                gameData.teams[teamIdx].score -= wager;
            }
            saveState();
            renderScoreboard();
            
            // Give visual feedback by disabling that team's buttons after grading
            event.target.parentElement.querySelectorAll(`button`).forEach(btn => {
                if(btn.innerText.includes(gameData.teams[teamIdx].name)) {
                    btn.disabled = true;
                    btn.style.opacity = '0.4';
                }
            });
        }

        function closeModal() {
            document.getElementById('question-modal').style.display = 'none';
        }

        function resetGame() {
            if (confirm("Are you sure you want to reset all scores and revealed clues?")) {
                gameData.usedClues = {};
                gameData.finalUsed = false;
                gameData.teams.forEach(t => t.score = 0);
                saveState();
                renderBoard();
            }
        }

        function openEditor() {
            const container = document.getElementById('editor-fields');
            let html = `
                <div class="editor-group">
                    <label>⭐ Final Jeopardy Question:</label>
                    <input type="text" id="fj-q" value="${escapeHtml(gameData.finalJeopardy.q)}">
                    <label>⭐ Final Jeopardy Answer:</label>
                    <input type="text" id="fj-a" value="${escapeHtml(gameData.finalJeopardy.a)}">
                </div>
            `;

            gameData.categories.forEach((cat, cIdx) => {
                html += `<div class="editor-group">
                    <label>Category ${cIdx + 1} Name:</label>
                    <input type="text" id="cat-name-${cIdx}" value="${escapeHtml(cat.name)}">`;
                
                cat.questions.forEach((item, qIdx) => {
                    const val = (qIdx + 1) * 100;
                    html += `
                        <label>$${val} Question:</label>
                        <input type="text" id="cat-${cIdx}-q-${qIdx}" value="${escapeHtml(item.q)}">
                        <label>$${val} Answer:</label>
                        <input type="text" id="cat-${cIdx}-a-${qIdx}" value="${escapeHtml(item.a)}">
                    `;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
            document.getElementById('editor-modal').style.display = 'flex';
        }

        function closeEditor() {
            document.getElementById('editor-modal').style.display = 'none';
        }

        function saveEditor() {
            const fjQ = document.getElementById('fj-q');
            const fjA = document.getElementById('fj-a');
            if (fjQ) gameData.finalJeopardy.q = fjQ.value;
            if (fjA) gameData.finalJeopardy.a = fjA.value;

            gameData.categories.forEach((cat, cIdx) => {
                const catNameInput = document.getElementById(`cat-name-${cIdx}`);
                if (catNameInput) cat.name = catNameInput.value;

                cat.questions.forEach((item, qIdx) => {
                    const qInput = document.getElementById(`cat-${cIdx}-q-${qIdx}`);
                    const aInput = document.getElementById(`cat-${cIdx}-a-${qIdx}`);
                    if (qInput) item.q = qInput.value;
                    if (aInput) item.a = aInput.value;
                });
            });

            saveState();
            closeEditor();
            renderBoard();
        }

        function escapeHtml(text) {
            return text.replace(/"/g, '&quot;');
        }

        renderBoard();
    </script>
</body>
</html>
