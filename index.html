<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanukah Jeopardy!</title>
    <style>
        :root {
            --bg-color: #0c1633;          /* Deep rich navy blue background */
            --card-bg: #15295c;           /* Vibrant blue for board and cards */
            --card-border: #27448c;       /* Slightly lighter blue border */
            --text-main: #ffffff;         /* Crisp white for text */
            --accent-gold: #fbc531;       /* Bright Jeopardy gold */
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            text-align: center;
            font-size: 2.3rem;
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: #dcdde1;
            margin-bottom: 25px;
            font-style: italic;
        }

        /* Teams Scoreboard */
        .teams-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .team-card {
            background: #ffffff;          /* White team card background as in picture */
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 12px 18px;
            text-align: center;
            min-width: 140px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .team-name {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #2f3640;
            cursor: pointer;
        }

        .team-score {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1b1464;
        }

        .score-buttons button {
            background: #f1f2f6;
            color: #2f3640;
            border: 1px solid #dcdde1;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 0 2px;
        }

        .score-buttons button:hover {
            background: #dfe4ea;
        }

        /* Game Board */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        .category-header {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .clue-cell {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            transition: background-color 0.15s, transform 0.1s;
        }

        .clue-cell:hover:not(.used) {
            background-color: #1c3577;
            transform: scale(1.02);
        }

        .clue-cell.used {
            background-color: #080d1f;
            color: #4b6584;
            border-color: #0c1633;
            cursor: default;
            box-shadow: none;
        }

        /* Final Jeopardy Button Bar */
        .final-jeopardy-bar {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
            text-align: center;
        }

        .final-btn {
            background: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .final-btn:hover {
            background: #1c3577;
        }

        .final-btn.used {
            background: #080d1f;
            color: #4b6584;
            border-color: #0c1633;
            cursor: default;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: #15295c;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1c3577;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #12204a;
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-top: 0;
        }

        .modal-body {
            font-size: 1.3rem;
            margin: 20px 0;
            line-height: 1.4;
            color: var(--text-main);
        }

        /* Timer badge */
        .timer-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 15px 0;
        }

        /* Award buttons grid inside modal */
        .award-section {
            margin-top: 20px;
            border-top: 1px dashed var(--card-border);
            padding-top: 15px;
        }

        .award-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .award-btn {
            background-color: #2ecc71;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .award-btn:hover {
            background-color: #27ae60;
        }

        .award-btn.nobody {
            background-color: #4b6584;
            color: #ffffff;
            grid-column: span 2;
        }

        .award-btn.nobody:hover {
            background-color: #38526f;
        }

        /* Editor Modal */
        .editor-modal .modal-content {
            max-width: 800px;
            text-align: left;
        }

        .editor-group {
            background: #0c1633;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .editor-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .editor-group input, .editor-group textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
            box-sizing: border-box;
            background: #15295c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <h1>🕯️ CHANUKAH JEOPARDY! 🕯️</h1>
    <div class="subtitle">The Festival of Lights trivia challenge</div>

    <!-- Scoreboard -->
    <div class="teams-container" id="scoreboard"></div>

    <!-- Game Board -->
    <div class="board" id="game-board"></div>

    <!-- Final Jeopardy Button -->
    <div class="final-jeopardy-bar">
        <button class="final-btn" id="final-jeopardy-trigger" onclick="openFinalJeopardy()">⭐ FINAL JEOPARDY ⭐</button>
    </div>

    <!-- Action Buttons -->
    <div class="controls">
        <button class="btn" onclick="openEditor()">Edit Questions & Answers</button>
        <button class="btn" onclick="resetGame()" style="background-color: #6c221f; color: #ffcccc; border-color: #a93226;">Reset Game</button>
    </div>

    <!-- Question Modal -->
    <div class="modal" id="question-modal">
        <div class="modal-content">
            <h2 id="modal-category-title">Category</h2>
            <div id="fj-timer-container" style="display: none;">
                <div class="timer-display" id="fj-timer">30</div>
            </div>
            <div class="modal-body" id="modal-question-text">Question goes here...</div>
            <div id="answer-container" style="display: none;">
                <hr style="border-color: var(--card-border); margin: 20px 0;">
                <div style="font-size: 1rem; color: var(--accent-gold); margin-bottom: 5px;">ANSWER:</div>
                <div class="modal-body" id="modal-answer-text" style="font-size: 1.2rem;">Answer goes here...</div>
                
                <div class="award-section">
                    <div style="font-size: 0.95rem; color: #dcdde1; margin-bottom: 8px;" id="award-instructions">AWARD POINTS TO:</div>
                    <div class="award-grid" id="award-buttons-container"></div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn" id="reveal-btn" onclick="revealAnswer()">Show Answer</button>
                <button class="btn" id="close-modal-btn" onclick="closeModal()" style="display: none; background-color: #4b6584;">Cancel / Close</button>
            </div>
        </div>
    </div>

    <!-- Editor Modal -->
    <div class="modal editor-modal" id="editor-modal">
        <div class="modal-content">
            <h2>Edit Game Content</h2>
            <div id="editor-fields"></div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn" onclick="saveEditor()" style="background-color: #27ae60; color: #fff;">Save & Apply</button>
                <button class="btn" onclick="closeEditor()" style="background-color: #c0392b; color: #fff;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let gameData = {
            teams: [
                { name: "Moishe and Rena", score: 0 },
                { name: "Zalmy and Eli", score: 0 },
                { name: "Atara, Sarah, Raphaella", score: 0 },
                { name: "Rafi and Gavriel", score: 0 }
            ],
            categories: [
                {
                    name: "📜 CHANUKAH HISTORY",
                    questions: [
                        { q: "What ancient empire ruled over the Jewish people during the events leading to Chanukah?", a: "The Greek Empire" },
                        { q: "Who led the rebellion?", a: "Yehudah Maccabee" },
                        { q: "What was the name of the Jewish group that led the revolt?", a: "The Maccabees" },
                        { q: "What is another name for the Maccabees?", a: "The Chashmonaim" },
                        { q: "What does the word Chanukah mean?", a: "Dedication (The dedication of the second Beis Hamikdash)" }
                    ]
                },
                {
                    name: "🕎 CHANUKA NIGHT",
                    questions: [
                        { q: "What do we light every night?", a: "The Menorah" },
                        { q: "What is the candle we use to light the other candles called?", a: "The Shamesh" },
                        { q: "What are the three brachos we say on the first night?", a: "Lehadlik Ner, She'asah Nissim, and Shehecheyanu" },
                        { q: "What are the two songs we say after lighting?", a: "Haneiros Hallalu and Ma'oz Tzur" },
                        { q: "According to Beis Shammai how do we light the Menorah?", a: "Eight candles the first night and one candle the last night" }
                    ]
                },
                {
                    name: "🥔 CHANUKAH FOODS",
                    questions: [
                        { q: "What potato pancakes are traditionally eaten during Chanukah?", a: "Latkes" },
                        { q: "What jelly-filled treats are popular during Chanukah (Hebrew name)?", a: "Sufganiyot" },
                        { q: "What ingredient is especially important in traditional Chanukah foods because of the miracle?", a: "Oil" },
                        { q: "What sweet topping is commonly served on latkes?", a: "Applesauce" },
                        { q: "Why do we eat dairy on Chanukah?", a: "Because Yehuddis defeated the general by feeding him cheese and wine" }
                    ]
                },
                {
                    name: "🎲 DREIDEL & GAMES",
                    questions: [
                        { q: "How many sides does a dreidel have?", a: "Four" },
                        { q: "What are the four Hebrew letters on a dreidel?", a: "Nun, Gimel, Hey, and Shin (or Peh in Israel)" },
                        { q: "What does the letter Gimel mean in the dreidel game?", a: "Take the entire pot" },
                        { q: "What do the letters on the dreidel stand for?", a: "Nes Gadol Haya Sham" },
                        { q: "What does the dreidel phrase 'Nes Gadol Haya Sham' mean?", a: "A great miracle happened there." }
                    ]
                },
                {
                    name: "⭐ CHANUKAH CHALLENGE",
                    questions: [
                        { q: "What is the date when Chanukah begins?", a: "The 25th of Kislev" },
                        { q: "What is the Hebrew word for oil?", a: "Shemen" },
                        { q: "What is the Hebrew word for light?", a: "Ohr" },
                        { q: "How many candles are needed to light all eight nights, not counting the shamash?", a: "36 candles" },
                        { q: "Because Chanukah falls on late November or late December what hybrid holiday happened in 2013?", a: "Thanksgivukah" }
                    ]
                }
            ],
            finalJeopardy: {
                q: "What was the name of the Jewish family that led the revolt against the Seleucid Greeks?",
                a: "The Maccabees."
            },
            usedClues: {},
            finalUsed: false
        };

        let currentClueValue = 0;
        let isFinalJeopardy = false;
        let finalWagers = {};
        let fjTimerInterval = null;
        let audioCtx = null;
        let isPlayingAudio = false;

        if (localStorage.getItem('chanukah_jeopardy_live_data')) {
            try {
                gameData = JSON.parse(localStorage.getItem('chanukah_jeopardy_live_data'));
            } catch (e) { console.error(e); }
        }

        function saveState() {
            localStorage.setItem('chanukah_jeopardy_live_data', JSON.stringify(gameData));
        }

        function renderBoard() {
            renderScoreboard();
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            gameData.categories.forEach((cat) => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerText = cat.name;
                board.appendChild(header);
            });

            for (let r = 0; r < 5; r++) {
                const value = (r + 1) * 100;
                gameData.categories.forEach((cat, cIdx) => {
                    const cell = document.createElement('div');
                    const clueKey = `${cIdx}-${r}`;
                    cell.className = 'clue-cell';
                    
                    if (gameData.usedClues[clueKey]) {
                        cell.classList.add('used');
                        cell.innerText = '';
                    } else {
                        cell.innerText = `$${value}`;
                        cell.onclick = () => openClue(cIdx, r, value);
                    }
                    board.appendChild(cell);
                });
            }

            const finalBtn = document.getElementById('final-jeopardy-trigger');
            if (gameData.finalUsed) {
                finalBtn.classList.add('used');
                finalBtn.innerText = '⭐ FINAL JEOPARDY (Played) ⭐';
            } else {
                finalBtn.classList.remove('used');
                finalBtn.innerText = '⭐ FINAL JEOPARDY ⭐';
            }
        }

        function renderScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '';
            gameData.teams.forEach((team, idx) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <div class="team-name" onclick="editTeamName(${idx})">${team.name} ✏️</div>
                    <div class="team-score">$${team.score}</div>
                    <div class="score-buttons">
                        <button onclick="adjustScore(${idx}, -100)">-</button>
                        <button onclick="adjustScore(${idx}, 100)">+</button>
                    </div>
                `;
                sb.appendChild(card);
            });
        }

        function adjustScore(teamIdx, amount) {
            gameData.teams[teamIdx].score += amount;
            saveState();
            renderScoreboard();
        }

        function editTeamName(teamIdx) {
            const newName = prompt("Enter new team name:", gameData.teams[teamIdx].name);
            if (newName !== null && newName.trim() !== "") {
                gameData.teams[teamIdx].name = newName.trim();
                saveState();
                renderScoreboard();
            }
        }

        function openClue(cIdx, rIdx, value) {
            stopJeopardyMusic();
            const clueKey = `${cIdx}-${rIdx}`;
            gameData.usedClues[clueKey] = true;
            saveState();
            renderBoard();

            currentClueValue = value;
            isFinalJeopardy = false;
            const cat = gameData.categories[cIdx];
            const clue = cat.questions[rIdx];

            document.getElementById('modal-category-title').innerText = `${cat.name} - $${value}`;
            document.getElementById('modal-question-text').innerText = clue.q;
            document.getElementById('modal-answer-text').innerText = clue.a;
            document.getElementById('fj-timer-container').style.display = 'none';
            
            resetModalView();
            document.getElementById('question-modal').style.display = 'flex';
        }

        function openFinalJeopardy() {
            stopJeopardyMusic();
            finalWagers = {};
            gameData.teams.forEach((team, idx) => {
                let maxWager = team.score > 0 ? team.score : 0;
                let promptMsg = `${team.name}, you have $${team.score}.\nEnter your Final Jeopardy wager (0 to $${maxWager}):`;
                let wagerInput = prompt(promptMsg, "0");
                
                let wager = parseInt(wagerInput);
                if (isNaN(wager) || wager < 0) wager = 0;
                if (wager > maxWager) wager = maxWager;
                
                finalWagers[idx] = wager;
            });

            gameData.finalUsed = true;
            saveState();
            renderBoard();

            isFinalJeopardy = true;
            document.getElementById('modal-category-title').innerText = "⭐ FINAL JEOPARDY ⭐";
            document.getElementById('modal-question-text').innerText = gameData.finalJeopardy.q;
            document.getElementById('modal-answer-text').innerText = gameData.finalJeopardy.a;
            
            document.getElementById('fj-timer-container').style.display = 'block';
            startFinalJeopardyTimer();
            playJeopardyMusic();
            
            resetModalView();
            document.getElementById('question-modal').style.display = 'flex';
        }

        // Web Audio API synthesizer for the iconic Final Jeopardy Think Theme
        function playJeopardyMusic() {
            if (isPlayingAudio) return;
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                isPlayingAudio = true;

                // Notes frequencies (Hz) for the classic melody loop
                // G4, C5, G4, D5, C5, Bb4, A4, G4 ...
                const notes = [
                    { f: 392.00, d: 0.5 }, { f: 523.25, d: 0.5 }, { f: 392.00, d: 0.5 }, { f: 587.33, d: 0.5 },
                    { f: 523.25, d: 0.5 }, { f: 466.16, d: 0.5 }, { f: 440.00, d: 0.5 }, { f: 392.00, d: 1.0 },
                    { f: 349.23, d: 0.5 }, { f: 440.00, d: 0.5 }, { f: 349.23, d: 0.5 }, { f: 523.25, d: 0.5 },
                    { f: 440.00, d: 0.5 }, { f: 392.00, d: 0.5 }, { f: 329.63, d: 0.5 }, { f: 293.66, d: 1.0 }
                ];

                let noteTime = audioCtx.currentTime + 0.1;
                
                // Play melody twice to fit ~30 seconds
                for (let loop = 0; loop < 2; loop++) {
                    notes.forEach(note => {
                        if (!audioCtx) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(note.f, noteTime);
                        
                        gain.gain.setValueAtTime(0.15, noteTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, noteTime + note.d - 0.05);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start(noteTime);
                        osc.stop(noteTime + note.d);
                        
                        noteTime += note.d;
                    });
                }
            } catch (e) {
                console.error("Audio playback error: ", e);
            }
        }

        function stopJeopardyMusic() {
            isPlayingAudio = false;
            if (audioCtx) {
                audioCtx.close().catch(() => {});
                audioCtx = null;
            }
            if (fjTimerInterval) {
                clearInterval(fjTimerInterval);
                fjTimerInterval = null;
            }
        }

        function startFinalJeopardyTimer() {
            let timeLeft = 30;
            const timerEl = document.getElementById('fj-timer');
            timerEl.innerText = timeLeft;

            if (fjTimerInterval) clearInterval(fjTimerInterval);

            fjTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    timerEl.innerText = timeLeft;
                } else {
                    clearInterval(fjTimerInterval);
                    stopJeopardyMusic();
                }
            }, 1000);
        }

        function resetModalView() {
